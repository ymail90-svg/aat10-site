<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff3e8">
<title>المصحف بالقراءات العشر</title>
<link rel="stylesheet" href="app.css?v=30">
</head>
<body>
<span id="tSura" hidden></span><span id="tSub" hidden></span>

<div class="modes" id="modes" role="tablist">
  <button class="ib2" id="bMenu" aria-label="القائمة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button class="chip2" data-hidx id="hSura" aria-label="اختيار السورة">السور ▾</button>
  <button class="ib2" data-hsrch aria-label="البحث"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button role="tab" data-m="show" class="on">قراءة</button>
  <button role="tab" data-m="tj">تهجد</button>
  <button role="tab" data-m="mem">تسميع</button>
  <button class="chip2" id="bRw" aria-label="اختيار المصحف"><span id="tRw">حفص</span></button>
  <button id="bBg" class="bgq" aria-label="تغيير لون الخلفية"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="f"/></svg></button>
</div>

<div class="memb" id="memBar">
  <button class="pri" id="revNext">أظهر الآية التالية</button>
  <button id="mkErr" class="e">خطأ</button><button id="mkHes" class="h">تردد</button>
  <button id="revAll">أظهر الكل</button><button id="hideAll">أخفِ الكل</button>
</div>

<main id="pages"><div class="pg"><div class="in" id="page"><p class="ld">جارٍ التحميل…</p></div></div></main>
<div class="below" id="below"></div>

<nav class="bot" id="bot">
  <button id="prev" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>السابقة</button>
  <label class="pn"><span class="sr">رقم الصفحة</span><input id="pnum" inputmode="numeric" aria-label="رقم الصفحة"></label>
  <button id="bMark" class="sq" aria-label="العلامات والملاحظات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" id="markIco"/></svg></button>
  <button id="next" aria-label="الصفحة التالية">التالية<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
</nav>

<div class="tjc" id="tjCtl" aria-label="التحكم في التمرير">
  <button id="tjBg" class="bgb" aria-label="تغيير الخلفية"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="f"/></svg></button>
  <button id="tjS" aria-label="أبطأ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <div class="spd" aria-live="polite"><small>السرعة</small><b id="tjSpd">١٠</b></div>
  <button id="tjF" aria-label="أسرع"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="tjP" class="big" aria-label="إيقاف مؤقت"><svg viewBox="0 0 24 24" aria-hidden="true" id="tjIco"><rect x="6" y="5" width="4" height="14" rx="1" class="f"/><rect x="14" y="5" width="4" height="14" rx="1" class="f"/></svg></button>
  <button id="tjStop" aria-label="إيقاف"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" class="f"/></svg></button>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="pop" id="pop" role="dialog"></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js?v=30"></script>
</body>
</html>
